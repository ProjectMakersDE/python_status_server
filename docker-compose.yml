services:
  pythonstatusserver:
    image: projectmakers/pythonstatusserver:latest
    container_name: pythonstatusserver
    ports:
      # Do not publish Basic Authentication directly to the internet. A local
      # reverse proxy can reach this port; set 0.0.0.0 only behind HTTPS.
      - "${STATUS_SERVER_BIND_ADDRESS:-127.0.0.1}:${STATUS_SERVER_PORT}:${STATUS_SERVER_PORT}"
    env_file:
      - /usr/local/bin/env/statusServer.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('STATUS_SERVER_PORT', '5000') + '/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - pm_network

networks:
  pm_network:
    external: true
    name: pm_network
